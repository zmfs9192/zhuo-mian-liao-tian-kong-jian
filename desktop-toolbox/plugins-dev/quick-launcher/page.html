<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>快捷启动</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; color: #1c1c1e; background: #fff; }
  #q { width: 100%; height: 40px; border: 1px solid rgba(0,0,0,0.16); border-radius: 8px; padding: 0 12px; font-size: 15px; outline: none; }
  #q:focus { border-color: #0f766e; }
  #status { color: #6e6e73; font-size: 12px; margin: 8px 2px; min-height: 16px; }
  #list { border-top: 1px solid rgba(0,0,0,0.08); }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid rgba(0,0,0,0.06); cursor: pointer; border-radius: 6px; }
  .row:hover, .row.sel { background: #e0f2f0; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { font-size: 12px; color: #8a8a8e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; color: #0f766e; background: #e6f4f1; border-radius: 999px; padding: 2px 8px; flex-shrink: 0; }
  .empty { color: #8a8a8e; padding: 18px 6px; }
  .hint { color: #8a8a8e; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<input id="q" type="text" placeholder="输入程序名字，支持中文、拼音首字母（如 wx 找微信）" autocomplete="off">
<div id="status">正在读取本机程序…</div>
<div id="list"></div>
<div class="hint">上下键移动，回车启动，点一下也可以启动。程序来自开始菜单与桌面快捷方式。</div>

'use strict';
/* 与工具箱主界面的 pluginCall 桥接：postMessage 调父页面转发。 */
var __id = 0;
var pending = {};
function call(method, args) {
  return new Promise(function (resolve) {
    var id = ++__id;
    pending[id] = resolve;
    window.parent.postMessage({ type: 'plugin-call', id: id, method: method, args: args || {} }, '*');
  });
}
window.addEventListener('message', function (e) {
  if (!e.data || e.data.type !== 'plugin-result' || !pending[e.data.id]) return;
  var r = pending[e.data.id]; delete pending[e.data.id]; r(e.data.result);
});

/* 汉字拼音首字母表（常用字，取最常用读音）。不在表里的字不参与首字母匹配，仍可按原名搜索。 */

var PINYIN = {};
for (var i = 0; i + 1 < PINYIN_PAIRS.length; i += 2) PINYIN[PINYIN_PAIRS[i]] = PINYIN_PAIRS[i + 1];

/* 首字母：英文单词取词首字母，汉字取拼音首字母。 */
function initialsOf(name) {
  var out = '';
  var inWord = false;
  for (var k = 0; k < name.length; k++) {
    var ch = name[k];
    if (/[a-zA-Z]/.test(ch)) {
      if (!inWord) { out += ch.toLowerCase(); inWord = true; }
    } else {
      inWord = false;
      var ini = PINYIN[ch];
      if (ini) out += ini;
    }
  }
  return out;
}
/* 匹配分级：原名包含 > 首字母开头 > 首字母包含。 */
function matchScore(app, q) {
  var name = (app.name || '').toLowerCase();
  if (name.indexOf(q) !== -1) return 2;
  var ini = initialsOf(app.name || '');
  if (ini.indexOf(q) === 0) return 1;
  if (ini.indexOf(q) !== -1) return 0;
  return -1;
}

var apps = [];
var filtered = [];
var sel = 0;
var qEl = document.getElementById('q');
var statusEl = document.getElementById('status');
var listEl = document.getElementById('list');

function render() {
  listEl.innerHTML = '';
  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty">' + (apps.length ? '没有匹配的程序，换个名字试试。' : '没有找到可启动的程序。') + '</div>';
    return;
  }
  filtered.slice(0, 30).forEach(function (app, idx) {
    var row = document.createElement('div');
    row.className = 'row' + (idx === sel ? ' sel' : '');
    var main = document.createElement('div');
    main.className = 'row-main';
    var t = document.createElement('div');
    t.className = 'row-title';
    t.textContent = app.name;
    var s = document.createElement('div');
    s.className = 'row-sub';
    s.textContent = [app.version ? ('版本 ' + app.version) : '', app.publisher || '', app.path || ''].filter(Boolean).join(' · ');
    main.appendChild(t);
    main.appendChild(s);
    row.appendChild(main);
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = app.source === 'desktop' ? '桌面' : (app.source === 'start-menu' ? '开始菜单' : '已装程序');
    row.appendChild(tag);
    row.addEventListener('click', function () { launch(app); });
    listEl.appendChild(row);
  });
}
function applyFilter() {
  var q = qEl.value.trim().toLowerCase();
  sel = 0;
  if (!q) { filtered = apps.slice(); }
  else {
    filtered = apps.map(function (app) { return { app: app, score: matchScore(app, q) }; })
      .filter(function (x) { return x.score >= 0; })
      .sort(function (a, b) { return b.score - a.score || a.app.name.localeCompare(b.app.name, 'zh'); })
      .map(function (x) { return x.app; });
  }
  statusEl.textContent = q ? ('找到 ' + filtered.length + ' 个') : ('共 ' + apps.length + ' 个程序');
  render();
}
function launch(app) {
  statusEl.textContent = '正在启动「' + app.name + '」…';
  call('files.open', { path: app.path }).then(function (r) {
    if (r && r.ok) statusEl.textContent = '已启动「' + app.name + '」。';
    else statusEl.textContent = '启动失败：' + ((r && r.error) || '未知原因');
  });
}
qEl.addEventListener('input', applyFilter);
qEl.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); if (sel < Math.min(filtered.length, 30) - 1) { sel++; render(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (sel > 0) { sel--; render(); } }
  else if (e.key === 'Enter') { e.preventDefault(); if (filtered[sel]) launch(filtered[sel]); }
  else if (e.key === 'Escape') { qEl.value = ''; applyFilter(); }
});
call('apps.list', {}).then(function (r) {
  if (r && r.ok) {
    apps = r.data || [];
    statusEl.textContent = '共 ' + apps.length + ' 个程序';
    applyFilter();
    qEl.focus();
  } else {
    statusEl.textContent = '读取程序列表失败：' + ((r && r.error) || '未知原因');
  }
});
</script>
